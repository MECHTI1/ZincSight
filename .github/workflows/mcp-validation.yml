name: MCP validation
on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'main_execute.py'
      - '.github/workflows/mcp-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      PYTHON_DOTENV_DISABLED: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      ZINCSIGHT_RUN_INTEGRATION: '1'
      ZINCSIGHT_RUN_PGLITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            integrations/mcp/requirements.txt
      - name: Install runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libgl1 libglu1-mesa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional embedded PostgreSQL
        run: npm ci --prefix integrations/mcp/pglite --ignore-scripts --no-audit --no-fund
      - name: Install Python dependencies
        run: python -m pip install -r integrations/mcp/requirements.txt pytest
      - name: Validate wrapper and real predictions
        run: python -m pytest tests/test_mcp.py tests/test_mcp_integration.py tests/test_probability_empty_results.py -v
